name: CD

on:
  push:
    branches: [homolog, prod]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  apply:
    name: Terraform apply (VPC + EKS + add-ons)
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name }}
    env:
      TF_ENV: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3

      # OIDC (secret AWS_DEPLOY_ROLE_ARN) ou chave de acesso de um usuário IAM (secrets
      # AWS_ACCESS_KEY_ID e AWS_SECRET_ACCESS_KEY), para contas em que a organização
      # bloqueia o provider OIDC do IAM. Cadastre só um dos dois.
      - name: Configurar credenciais AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Init
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=infra-k8s/${TF_ENV}/terraform.tfstate" \
            -backend-config="region=${{ vars.AWS_REGION }}" \
            -backend-config="dynamodb_table=${{ vars.TF_LOCK_TABLE }}"

      - name: Apply
        env:
          AWS_REGION_TF: ${{ vars.AWS_REGION }}
          # Admins do EKS além de quem aplica (lista JSON de ARNs; veja o README, seção Conta AWS).
          ADMINS: ${{ vars.EKS_ADMIN_ARNS || '[]' }}
          NR_LICENSE: ${{ secrets.NEW_RELIC_LICENSE_KEY }}
        run: |
          VARS=(-var="environment=${TF_ENV}" -var="aws_region=${AWS_REGION_TF}"
                -var="cluster_admin_arns=${ADMINS}" -var="newrelic_license_key=${NR_LICENSE}")
          # O provider kubectl não aceita o endpoint do cluster ainda desconhecido no plan. Num
          # ambiente novo, a VPC e o EKS sobem antes, num apply com -target. Os dois módulos: só
          # com o EKS, a VPC sai sem NAT, IGW e rotas, e os nós não entram no cluster.
          if ! aws eks describe-cluster --name "oficina-${TF_ENV}" > /dev/null 2>&1; then
            terraform apply -auto-approve -target=module.vpc -target=module.eks "${VARS[@]}"
          fi
          terraform apply -auto-approve "${VARS[@]}"
